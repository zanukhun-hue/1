[build]
  command = "node tools/build-netlify.cjs"
  publish = "netlify-public"

[build.processing.html]
  pretty_urls = false

[functions.catalog]
  included_files = [
    "redesign.js",
    "preset-library.js",
    "preset-shop.js",
    "preset-products.js",
    "plugins.js",
    "discovery.json",
    "plugin-media.json",
    "plugin-images.json",
    "compatibility.json",
    "recipes.json",
    "presets-index.tsv.gz.b64",
    "google3dda0bd7c0af07a0.html",
